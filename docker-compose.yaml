# WordPress Blueprint for Coolify
# Features: SSH access, WP-CLI, High PHP limits
#
# USAGE IN COOLIFY:
# 1. Create new "Docker Compose" resource
# 2. Paste this content
# 3. Set environment variables in Coolify UI
#
services:
  wordpress:
    build:
      context: .
      dockerfile: Dockerfile
    # Or use pre-built image from your registry:
    # image: ghcr.io/YOUR_USERNAME/wordpress-ssh:latest
    volumes:
      - 'wordpress-files:/var/www/html'
    environment:
      - SERVICE_URL_WORDPRESS
      - WORDPRESS_DB_HOST=mariadb
      - WORDPRESS_DB_USER=$SERVICE_USER_WORDPRESS
      - WORDPRESS_DB_PASSWORD=$SERVICE_PASSWORD_WORDPRESS
      - WORDPRESS_DB_NAME=wordpress
      # SSH password - set this in Coolify!
      - SSH_PASSWORD=$SSH_PASSWORD
    ports:
      # SSH port - Coolify will map this
      - "2222:22"
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1"]
      interval: 5s
      timeout: 10s
      retries: 10

  mariadb:
    image: 'mariadb:11'
    volumes:
      - 'mariadb-data:/var/lib/mysql'
    environment:
      - MYSQL_ROOT_PASSWORD=$SERVICE_PASSWORD_ROOT
      - MYSQL_DATABASE=wordpress
      - MYSQL_USER=$SERVICE_USER_WORDPRESS
      - MYSQL_PASSWORD=$SERVICE_PASSWORD_WORDPRESS
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 20s
      retries: 10

volumes:
  wordpress-files:
  mariadb-data:
