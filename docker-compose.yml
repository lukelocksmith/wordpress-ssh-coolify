# WordPress Blueprint for Coolify
#
# Features:
# - Standard wordpress:latest image
# - PHP limits in uploads.ini (edit values below and redeploy)
# - SSH access with WP-CLI (port 2222)
#
# SSH connection:
#   ssh wp@your-domain.com -p 2222
#   Password: set SSH_PASSWORD in Coolify environment variables
#
# WP-CLI via SSH:
#   ssh wp@your-domain.com -p 2222
#   wp plugin list
#   wp theme list

services:
  wordpress:
    image: wordpress:latest
    volumes:
      - wordpress-files:/var/www/html
      - type: bind
        source: ./uploads.ini
        target: /usr/local/etc/php/conf.d/uploads.ini
        content: |
          file_uploads = On
          upload_max_filesize = 512M
          post_max_size = 512M
          memory_limit = 512M
          max_execution_time = 600
          max_input_time = 600
          max_input_vars = 10000
    environment:
      - WORDPRESS_DB_HOST=mariadb
      - WORDPRESS_DB_USER=$SERVICE_USER_WORDPRESS
      - WORDPRESS_DB_PASSWORD=$SERVICE_PASSWORD_WORDPRESS
      - WORDPRESS_DB_NAME=wordpress
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sL http://localhost:80/ -o /dev/null -w '%{http_code}' | grep -qE '^[23]'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  mariadb:
    image: mariadb:11
    volumes:
      - mariadb-data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=$SERVICE_PASSWORD_ROOT
      - MYSQL_DATABASE=wordpress
      - MYSQL_USER=$SERVICE_USER_WORDPRESS
      - MYSQL_PASSWORD=$SERVICE_PASSWORD_WORDPRESS
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 20s
      retries: 10

  ssh:
    image: lscr.io/linuxserver/openssh-server:latest
    environment:
      - PUID=33
      - PGID=33
      - TZ=Europe/Warsaw
      - USER_NAME=wp
      - USER_PASSWORD=$SSH_PASSWORD
      - PASSWORD_ACCESS=true
      - SUDO_ACCESS=true
    volumes:
      - wordpress-files:/var/www/html
      - type: bind
        source: ./install-wpcli.sh
        target: /custom-cont-init.d/install-wpcli.sh
        content: |
          #!/bin/bash
          curl -O https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x wp-cli.phar
          mv wp-cli.phar /usr/local/bin/wp
          apk add --no-cache php83 php83-phar php83-mbstring php83-iconv php83-openssl php83-curl php83-mysqli php83-json php83-xml
          ln -sf /usr/bin/php83 /usr/bin/php
    ports:
      - "2222:2222"
    depends_on:
      wordpress:
        condition: service_healthy

volumes:
  wordpress-files:
  mariadb-data:
