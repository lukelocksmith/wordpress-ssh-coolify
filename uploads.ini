; PHP Configuration for WordPress
; Optimized for MainWP and large file uploads

; File uploads
file_uploads = On
upload_max_filesize = 512M
post_max_size = 512M

; Memory and execution
memory_limit = 512M
max_execution_time = 600
max_input_time = 600

; Form/input limits (important for MainWP)
max_input_vars = 10000

; Error handling (optional - useful for debugging)
; display_errors = Off
; log_errors = On
; error_log = /var/log/php_errors.log
