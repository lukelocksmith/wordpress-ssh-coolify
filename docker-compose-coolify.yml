# ============================================
# WordPress Blueprint for Coolify
# ============================================
# Features:
#   ✅ SSH access (port 22 in container)
#   ✅ WP-CLI pre-installed
#   ✅ PHP limits: 512M upload, 512M memory, 10000 max_input_vars
#
# HOW TO USE IN COOLIFY:
# 1. Projects → Your Project → Add New Resource → Docker Compose
# 2. Paste this YAML
# 3. Set environment variable SSH_PASSWORD in Coolify UI
# 4. In "Network" section, add port mapping for SSH (e.g., 2222:22)
# 5. Deploy!
#
# SSH Connection:
#   ssh -p 2222 root@your-domain.com
#   Password: value of SSH_PASSWORD
#
# WP-CLI Usage:
#   ssh -p 2222 root@your-domain.com
#   wp plugin list --allow-root --path=/var/www/html
# ============================================

services:
  wordpress:
    image: 'wordpress-ssh:latest'
    volumes:
      - 'wordpress-files:/var/www/html'
    environment:
      - SERVICE_URL_WORDPRESS
      - WORDPRESS_DB_HOST=mariadb
      - WORDPRESS_DB_USER=$SERVICE_USER_WORDPRESS
      - WORDPRESS_DB_PASSWORD=$SERVICE_PASSWORD_WORDPRESS
      - WORDPRESS_DB_NAME=wordpress
      # SET THIS IN COOLIFY UI!
      - SSH_PASSWORD=${SSH_PASSWORD:-wordpress123}
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1"]
      interval: 5s
      timeout: 10s
      retries: 10
    # SSH port - Coolify will handle mapping
    expose:
      - "22"

  mariadb:
    image: 'mariadb:11'
    volumes:
      - 'mariadb-data:/var/lib/mysql'
    environment:
      - MYSQL_ROOT_PASSWORD=$SERVICE_PASSWORD_ROOT
      - MYSQL_DATABASE=wordpress
      - MYSQL_USER=$SERVICE_USER_WORDPRESS
      - MYSQL_PASSWORD=$SERVICE_PASSWORD_WORDPRESS
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 20s
      retries: 10

volumes:
  wordpress-files:
  mariadb-data:
